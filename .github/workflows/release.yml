name: Release

# Publishes to npm only when a version tag is pushed (v1.2.3).
# Auth is npm Trusted Publishing (OIDC) for workflow file release.yml,
# with no GitHub environment. No npm token is used.
# Node 24 provides npm >= 11.5.1, which trusted publishing requires.
# Trusted publishing generates provenance automatically.
# publishConfig.provenance in package.json is that same switch, so the
# CLI flag is not passed.
# A TLOG_CREATE_ENTRY_ERROR 409 is Rekor saying this process already
# wrote the entry and then retried it (npm/cli#10078). The registry PUT
# has not run. A new process signs with a new key.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Require npm trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm ${version}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error("trusted publishing needs npm >= 11.5.1, got " + process.argv[1]);
              process.exit(1);
            }
          ' "$version"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: License check
        run: npm run licenses

      - name: Publish
        run: |
          log="${RUNNER_TEMP}/npm-publish.log"
          for attempt in 1 2 3; do
            if npm publish --access public >"$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            cat "$log" >&2
            if [ "$attempt" -eq 3 ] || ! grep -q 'TLOG_CREATE_ENTRY_ERROR' "$log"; then
              exit 1
            fi
            echo "Transparency log conflict on attempt ${attempt}/3; retrying with a new signing key." >&2
            sleep $((attempt * 10))
          done
